<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RTL — Reservas y administración de canchas deportivas." />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>RTL — Reserva Tu Lugar</title>
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: grid; background: #eef2f7; transition: opacity .25s ease, visibility .25s ease; }
      #boot-splash.is-done { opacity: 0; visibility: hidden; }
      .rtl-loader { display: grid; place-content: center; justify-items: center; gap: 22px; color: #566070; font: 600 .85rem 'Plus Jakarta Sans', system-ui, sans-serif; animation: rtl-loader-in .25s ease .12s both; }
      .rtl-loader-mark { position: relative; display: block; width: 64px; height: 64px; animation: rtl-loader-breathe 1.5s ease-in-out infinite; }
      .rtl-loader-mark img { display: block; width: 100%; height: 100%; border-radius: 17%; box-shadow: 0 6px 16px #1f27331f; }
      .rtl-loader-mark::before { content: ''; position: absolute; inset: -11px; border-radius: 50%; background: conic-gradient(#10b98100 35%, #10b981); -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, #0000 calc(100% - 3px), #000 calc(100% - 2.5px)); animation: rtl-loader-orbit .9s linear infinite; }
      @keyframes rtl-loader-in { from { opacity: 0; } }
      @keyframes rtl-loader-breathe { 50% { transform: scale(.94); } }
      @keyframes rtl-loader-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .rtl-loader, .rtl-loader-mark, .rtl-loader-mark::before { animation: none; } }
    </style>
    <noscript><style>#boot-splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot-splash"><div class="rtl-loader" role="status"><span class="rtl-loader-mark"><img src="/assets/logo-mark.webp" alt="" width="64" height="64" /></span><span class="rtl-loader-label">Cargando RTL…</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
